<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미국식 발음 듣기 탑재! 4단계 복습 단어 앱</title>
    <style>
        :root {
            --primary: #4A90E2;
            --danger: #E24A4A;
            --success: #2ECC71;
            --bg: #F5F7FA;
            --dark: #333;
        }
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            max-width: 550px;
            width: 100%;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2, h3 { text-align: center; color: var(--dark); margin-top: 0; }
        
        /* 단어 관리 섹션 */
        .manage-section {
            background: #fdfdfd;
            border: 1px dashed #ccc;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
        }
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .input-group input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .word-list-box {
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 6px;
            background: #fff;
            padding: 5px;
        }
        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            border-bottom: 1px solid #f5f5f5;
            font-size: 14px;
        }
        .word-item:last-child { border-bottom: none; }
        .del-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-weight: bold;
        }

        /* 발음 듣기 스피커 버튼 스타일 */
        .tts-btn {
            background: #eef5fc;
            border: 1px solid #cce0f5;
            border-radius: 4px;
            cursor: pointer;
            padding: 2px 6px;
            margin-left: 5px;
            font-size: 14px;
            transition: all 0.2s;
        }
        .tts-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* 퀴즈 단계 표시 바 */
        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            background: #eee;
            padding: 5px;
            border-radius: 20px;
        }
        .step {
            flex: 1;
            text-align: center;
            font-size: 11px;
            padding: 6px 0;
            color: #666;
            border-radius: 15px;
        }
        .step.active {
            background: var(--primary);
            color: white;
            font-weight: bold;
        }
        .step.review-step {
            background: #ff9f43;
            color: white;
            font-weight: bold;
        }
        
        /* 카드 디자인 */
        .word-card {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #eef;
        }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        .word-card input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        .word-card input[type="text"]:focus {
            border-color: var(--primary);
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-primary { background: var(--primary); }
        .btn-add { background: var(--dark); padding: 8px 15px; border-radius: 4px; color: white; cursor: pointer; border: none; }
        .btn:hover, .btn-add:hover { opacity: 0.9; }
        
        /* 오답 강조 스타일 */
        .wrong-text { color: var(--danger); font-weight: bold; text-decoration: line-through; }
        .correct-text { color: var(--success); font-weight: bold; }
        .hint { font-size: 14px; color: #666; margin-bottom: 15px; text-align: center; }
        .alert-text { color: var(--danger); text-align: center; font-weight: bold; margin: 15px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>4단계 단어 복습 매니저</h2>
    
    <!-- [1] 단어 관리창 -->
    <div class="manage-section" id="manager-view">
        <h3>📋 단어장 관리 (자동 저장됨)</h3>
        <div class="input-group">
            <input type="text" id="new-eng" placeholder="영어 단어 (예: apple)">
            <input type="text" id="new-kor" placeholder="한글 뜻 (예: 사과)">
            <button class="btn-add" onclick="addWord()">추가</button>
        </div>
        <div class="word-list-box" id="word-list-container"></div>
    </div>

    <!-- [2] 단계 표시 바 -->
    <div class="step-indicator">
        <div class="step active" id="s1">1. 뜻 쓰기</div>
        <div class="step" id="s2">2. 철자 쓰기</div>
        <div class="step" id="s3">3. 오답 체크</div>
        <div class="step" id="s4">4. 오답 재복습</div>
    </div>

    <!-- [3] 본문 영역 -->
    <div id="quiz-content"></div>
    
    <!-- [4] 제어 버튼 -->
    <button class="btn btn-primary" id="next-btn" onclick="nextStep()" style="margin-top: 15px;">퀴즈 시작하기</button>
</div>

<script>
    let originalWords = JSON.parse(localStorage.getItem("myWordList")) || [
        { eng: "apple", kor: "사과" },
        { eng: "banana", kor: "바나나" }
    ];

    let quizWords = [];      
    let userAnswers = [];    
    let wrongWords = [];     
    let reviewAnswers = [];  
    let currentStep = 0;     

    updateWordList();
    renderStep();

    // [핵심 기능] 미국 발음으로 영단어를 읽어주는 함수
    function speak(text) {
        if (!window.speechSynthesis) {
            alert("이 브라우저는 발음 듣기 기능을 지원하지 않습니다.");
            return;
        }
        // 이전에 읽고 있던 음성이 있다면 강제 종료
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US'; // 미국 영어 언어 설정
        utterance.rate = 0.9;     // 학습을 위해 속도를 살짝 느리게 설정 (1.0이 기본)

        // 브라우저 내장 음성 중 미국인 화자 세팅 찾기 (선택 사항)
        const voices = window.speechSynthesis.getVoices();
        const usVoice = voices.find(v => v.lang === 'en-US' || v.lang.includes('en_US'));
        if (usVoice) utterance.voice = usVoice;

        window.speechSynthesis.speak(utterance);
    }

    function saveToLocalStorage() {
        localStorage.setItem("myWordList", JSON.stringify(originalWords));
    }

    function updateWordList() {
        const container = document.getElementById("word-list-container");
        if (originalWords.length === 0) {
            container.innerHTML = `<div style="color:#999; text-align:center; padding:10px; font-size:13px;">등록된 단어가 없습니다.</div>`;
            return;
        }
        let html = "";
        originalWords.forEach((word, index) => {
            html += `
                <div class="word-item">
                    <span>
                        <strong>${word.eng}</strong> 
                        <button class="tts-btn" onclick="speak('${word.eng}')">🔊 듣기</button>
                        ➔ ${word.kor}
                    </span>
                    <button class="del-btn" onclick="deleteWord(${index})">✕ 삭제</button>
                </div>`;
        });
        container.innerHTML = html;
    }

    function addWord() {
        const eng = document.getElementById("new-eng").value.trim();
        const kor = document.getElementById("new-kor").value.trim();
        if (!eng || !kor) return alert("영어와 뜻을 모두 입력하세요!");
        
        originalWords.push({ eng, kor });
        saveToLocalStorage(); 
        
        document.getElementById("new-eng").value = "";
        document.getElementById("new-kor").value = "";
        updateWordList();
        if (currentStep === 0) renderStep();
    }

    function deleteWord(index) {
        if (currentStep > 0) return alert("퀴즈 진행 중에는 단어를 삭제할 수 없습니다.");
        
        originalWords.splice(index, 1);
        saveToLocalStorage(); 
        
        updateWordList();
        if (currentStep === 0) renderStep();
    }

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function renderStep() {
        const content = document.getElementById("quiz-content");
        const nextBtn = document.getElementById("next-btn");
        const managerView = document.getElementById("manager-view");
        
        document.querySelectorAll('.step').forEach((el, idx) => {
            el.classList.toggle('active', idx + 1 === currentStep);
            if(currentStep >= 4) document.getElementById('s4').classList.add('review-step');
            else document.getElementById('s4').classList.remove('review-step');
        });

        let html = "";

        if (currentStep === 0) {
            managerView.style.display = "block";
            if (originalWords.length === 0) {
                html = `<div class="alert-text">⚠️ 단어를 1개 이상 추가해 주세요!</div>`;
                nextBtn.style.display = "none";
            } else {
                html = `<p class="hint">아래 버튼을 누르면 단어들이 랜덤으로 섞여 퀴즈가 시작됩니다.</p>`;
                nextBtn.style.display = "block";
                nextBtn.innerText = "1단계: 철자 보고 한글 뜻 쓰기 시작";
            }
        }
        else if (currentStep === 1) {
            managerView.style.display = "none";
            html += `<p class="hint">💡 제시된 <b>영어 철자</b>를 보고 알맞은 <b>한글 뜻</b>을 입력하세요. (🔊 버튼으로 발음을 들을 수 있습니다)</p>`;
            quizWords.forEach((word, i) => {
                html += `
                    <div class="word-card">
                        <label>${i + 1}번 단어: 
                            <span style="color:var(--primary); font-size:18px;">${word.eng}</span>
                            <button class="tts-btn" onclick="speak('${word.eng}')">🔊 발음 듣기</button>
                        </label>
                        <input type="text" id="kor-${i}" value="${userAnswers[i]?.kor || ''}" placeholder="한글 뜻 입력">
                    </div>`;
            });
            nextBtn.innerText = "2단계: 내가 쓴 뜻 보고 영어 철자 다시 쓰기";
        } 
        else if (currentStep === 2) {
            html += `<p class="hint">💡 원본 영어는 숨겨집니다. 본인이 작성한 <b>한글 뜻</b>만 보고 <b>영어 철자</b>를 적으세요.</p>`;
            quizWords.forEach((word, i) => {
                html += `
                    <div class="word-card">
                        <label>${i + 1}번 내가 쓴 뜻: <span style="color:var(--primary); font-size:18px;">${userAnswers[i].kor || '(미입력)'}</span></label>
                        <input type="text" id="eng-${i}" value="${userAnswers[i]?.eng || ''}" placeholder="영어 철자 입력">
                    </div>`;
            });
            nextBtn.innerText = "3단계: 오답 빨간색 검사하기";
        } 
        else if (currentStep === 3) {
            html += `<p class="hint">💡 틀린 부분은 <span class="wrong-text">빨간색</span>으로 표시됩니다. 다음 버튼을 누르면 틀린 단어 복습을 시작합니다.</p>`;
            wrongWords = []; 

            quizWords.forEach((word, i) => {
                const isKorWrong = userAnswers[i].kor.trim() !== word.kor;
                const isEngWrong = userAnswers[i].eng.trim().toLowerCase() !== word.eng.toLowerCase();

                if (isKorWrong || isEngWrong) {
                    wrongWords.push(word); 
                }

                html += `
                    <div class="word-card">
                        <label>${i + 1}번 검사 결과 <button class="tts-btn" onclick="speak('${word.eng}')">🔊 정답 발음</button></label>
                        <p><b>입력한 뜻:</b> ${isKorWrong ? `<span class="wrong-text">${userAnswers[i].kor || '(공백)'}</span> ➔ <span class="correct-text">${word.kor}</span>` : `<span class="correct-text">${userAnswers[i].kor} ⭕</span>`}</p>
                        <p><b>입력한 철자:</b> ${isEngWrong ? `<span class="wrong-text">${userAnswers[i].eng || '(공백)'}</span> ➔ <span class="correct-text">${word.eng}</span>` : `<span class="correct-text">${userAnswers[i].eng} ⭕</span>`}</p>
                    </div>`;
            });

            if (wrongWords.length > 0) {
                nextBtn.innerText = `4단계: 틀린 단어 (${wrongWords.length}개) 뜻 재복습하기`;
            } else {
                nextBtn.innerText = "모두 맞췄습니다! 완료하기";
            }
        } 
        else if (currentStep === 4) {
            html += `<p class="hint" style="color:var(--danger)">🔥 오답 복습 1탄: 본래 데이터의 <b>영어 철자</b>를 보고 <b>한글 뜻</b>을 입력하세요.</p>`;
            wrongWords.forEach((word, i) => {
                html += `
                    <div class="word-card" style="border-left: 5px solid var(--danger);">
                        <label>오답 ${i + 1}번: 
                            <span style="color:var(--danger); font-size:18px;">${word.eng}</span>
                            <button class="tts-btn" onclick="speak('${word.eng}')">🔊 듣기</button>
                        </label>
                        <input type="text" id="re-kor-${i}" value="${reviewAnswers[i]?.kor || ''}" placeholder="올바른 한글 뜻 입력">
                    </div>`;
            });
            nextBtn.innerText = "다음: 한글 뜻 보고 철자 입력하기";
        }
        else if (currentStep === 5) {
            html += `<p class="hint" style="color:var(--danger)">🔥 오답 복습 2탄: 본래 데이터의 <b>한글 뜻</b>을 보고 <b>영어 철자</b>를 입력하세요. (철자가 기억 안 나면 슬쩍 발음을 들어보세요!)</p>`;
            wrongWords.forEach((word, i) => {
                html += `
                    <div class="word-card" style="border-left: 5px solid var(--danger);">
                        <label>오답 ${i + 1}번 뜻: 
                            <span style="color:var(--dark); font-size:18px;">${word.kor}</span>
                            <button class="tts-btn" onclick="speak('${word.eng}')">🔊 힌트 듣기</button>
                        </label>
                        <input type="text" id="re-eng-${i}" value="${reviewAnswers[i]?.eng || ''}" placeholder="올바른 영어 철자 입력">
                    </div>`;
            });
            nextBtn.innerText = "재복습 결과 최종 확인";
        }
        else if (currentStep === 6) {
            html += `<p class="hint">💡 오답 재복습 채점 결과입니다. 확실히 외워졌는지 체크해 보세요.</p>`;
            wrongWords.forEach((word, i) => {
                const isKorWrong = reviewAnswers[i].kor.trim() !== word.kor;
                const isEngWrong = reviewAnswers[i].eng.trim().toLowerCase() !== word.eng.toLowerCase();

                html += `
                    <div class="word-card">
                        <label>오답 복습 ${i + 1}번 최종 피드백 <button class="tts-btn" onclick="speak('${word.eng}')">🔊 발음 다시듣기</button></label>
                        <p><b>뜻 작성:</b> ${isKorWrong ? `<span class="wrong-text">${reviewAnswers[i].kor || '(공백)'}</span> ➔ <span class="correct-text">${word.kor}</span>` : `<span class="correct-text">${word.kor} ⭕</span>`}</p>
                        <p><b>철자 작성:</b> ${isEngWrong ? `<span class="wrong-text">${reviewAnswers[i].eng || '(공백)'}</span> ➔ <span class="correct-text">${word.eng}</span>` : `<span class="correct-text">${word.eng} ⭕</span>`}</p>
                    </div>`;
            });
            nextBtn.innerText = "모든 루틴 종료 (단어장으로)";
        }

        content.innerHTML = html;
    }

    function nextStep() {
        if (currentStep === 0) {
            quizWords = shuffle(JSON.parse(JSON.stringify(originalWords)));
            userAnswers = quizWords.map(() => ({ kor: "", eng: "" }));
            currentStep = 1;
        } else if (currentStep === 1) {
            quizWords.forEach((_, i) => {
                userAnswers[i].kor = document.getElementById(`kor-${i}`).value;
            });
            currentStep = 2;
        } else if (currentStep === 2) {
            quizWords.forEach((_, i) => {
                userAnswers[i].eng = document.getElementById(`eng-${i}`).value;
            });
            currentStep = 3;
        } else if (currentStep === 3) {
            if (wrongWords.length > 0) {
                reviewAnswers = wrongWords.map(() => ({ kor: "", eng: "" }));
                currentStep = 4; 
            } else {
                currentStep = 0; 
            }
        } else if (currentStep === 4) {
            wrongWords.forEach((_, i) => {
                reviewAnswers[i].kor = document.getElementById(`re-kor-${i}`).value;
            });
            currentStep = 5; 
        } else if (currentStep === 5) {
            wrongWords.forEach((_, i) => {
                reviewAnswers[i].eng = document.getElementById(`re-eng-${i}`).value;
            });
            currentStep = 6; 
        } else if (currentStep === 6) {
            currentStep = 0; 
        }
        renderStep();
    }

    // 브라우저가 처음에 음성 목록을 로드할 때 싱크를 맞추기 위한 이벤트 트리거
    if (window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
    }
</script>

</body>
</html>
